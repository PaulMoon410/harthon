databases:
  - name: harthon-db
    plan: free
    databaseName: harthon
    user: harthon_user

services:
  - type: web
    name: harthon-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
