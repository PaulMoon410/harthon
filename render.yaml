databases:
  - name: harthon-db
    plan: free
    databaseName: harthon
    user: harthon_user

services:
  - type: web
    name: harthon-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHON_API_KEY
        sync: false
    healthCheckPath: /health